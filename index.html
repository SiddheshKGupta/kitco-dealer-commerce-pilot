<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KITCO Management Suite</title>
  <meta name="description" content="Management Command Centre for Performance, Accountability and Operational Control">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme:light;

      /* Canvas — three levels, so a block reads as a block */
      --canvas:#F7F5F8;
      --surface:#FFFFFF;
      --sunk:#EFEDF1;

      /* Ink — one ink, three weights */
      --ink:#1C121B;
      --muted:#605A60;
      --faint:#6E6670;

      /* Accent — brand and interaction. NEVER a state.
         KITCO's real brand colour is unconfirmed; Deep Plum is the documented
         fallback, and swapping it here is the whole change. */
      --brand:#53284F;
      --brand-hover:#3B1C39;
      --brand-tint:#F4ECF3;

      /* State — text tones. Every one clears AA on canvas and surface. */
      --pass:#14664A;
      --warn:#8A5300;
      --fail:#B0242C;
      --info:#1F5FA8;

      /* State — fills and indicators ONLY. Never a word. */
      --pass-fill:#2D8A56;
      --warn-fill:#E59400;
      --fail-fill:#D93838;
      --pass-tint:#E6F4EE;
      --warn-tint:#FBF3E3;
      --fail-tint:#FCEBEA;
      --info-tint:#EAF2FC;

      /* Rules — --rule is decorative and exempt from 1.4.11.
         --rule-control bounds real controls and meets 3:1. */
      --rule:#E2E0E4;
      --rule-control:#8A848C;

      /* Type — one family. Figures use tabular-nums, not a second font. */
      --sans:"Archivo","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
      --fs-label:11.5px;
      --fs-small:12.5px;
      --fs-base:13.5px;
      --fs-lead:15px;
      --fs-fig:20px;
      --fs-fig-l:28px;
      --fs-title:38px;

      /* Measure */
      --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
      --sp-5:24px; --sp-6:32px; --sp-7:48px;
      --row-h:36px;
      --radius:10px;
      --shadow-overlay:0 18px 50px rgba(28,18,27,.18);
    }

    /* Density registers. Two registers, one token set, one attribute. */
    [data-register="exec"]{--fs-body:var(--fs-lead);--fs-figure:var(--fs-fig-l);--rhythm:var(--sp-5)}
    [data-register="work"]{--fs-body:var(--fs-base);--fs-figure:var(--fs-fig);--rhythm:var(--sp-3)}
    /* Overlays are always working density, whatever opened them. */
    .drawer,.modal{--fs-body:var(--fs-base);--fs-figure:var(--fs-fig);--rhythm:var(--sp-3)}
    :root[data-theme="dark"]{
      color-scheme:dark;
      --canvas:#141118;
      --surface:#1C1822;
      --sunk:#17141D;
      --ink:#F4F1F6;
      --muted:#A79FA8;
      --faint:#948B96;
      --brand:#C79BC2;
      --brand-hover:#D9B6D5;
      --brand-tint:#2C2130;
      --pass:#5FC79B;
      --warn:#E0A45A;
      --fail:#F0868C;
      --info:#7FB0EE;
      --pass-tint:#16302A;
      --warn-tint:#33270F;
      --fail-tint:#3A1D20;
      --info-tint:#182A3F;
      --rule:#2E2836;
      --rule-control:#8F8694;
      --shadow-overlay:0 18px 50px rgba(0,0,0,.5);
    }
    *{box-sizing:border-box}
    html{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:var(--fs-base)}
    html,body{max-width:100%;overflow-x:hidden}
    body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink)}
    .mono,.kpi-value,.impact,td.mono,.health-value,.figure-value{font-variant-numeric:tabular-nums;font-family:var(--sans)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
      outline:3px solid color-mix(in srgb,var(--brand) 28%,transparent);outline-offset:2px
    }
    .app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:var(--canvas)}
    .sidebar{position:sticky;top:0;height:100vh;background:var(--sunk);color:var(--muted);border-right:1px solid var(--rule);padding:14px 10px;display:flex;flex-direction:column;z-index:20}
    .brand{padding:2px 4px 14px;border-bottom:1px solid var(--rule)}
    .brand-mark{display:flex;align-items:center;gap:10px;padding:0 6px 12px;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
    .brand-seal{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--brand);border-radius:8px;color:var(--brand);font-family:var(--sans);font-size:var(--fs-small)}
    .workspace-switcher{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px;text-align:left}
    .workspace-switcher:hover{background:var(--sunk);border-color:var(--rule-control)}
    .workspace-switcher>span:nth-child(2){min-width:0}
    .workspace-switcher strong,.workspace-switcher small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .workspace-switcher strong{font-size:var(--fs-small)}.workspace-switcher small{margin-top:2px;color:var(--muted);font-size:var(--fs-small);line-height:1.3}
    .workspace-avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--brand-tint);color:var(--brand);font-family:var(--sans);font-size:var(--fs-small);font-weight:700}
    .nav-label{color:var(--faint);margin:18px 10px 6px;text-transform:uppercase;letter-spacing:.13em;font-size:var(--fs-small);font-weight:700}
    .nav{display:grid;gap:5px}
    .nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:44px;border:0;background:transparent;color:var(--muted);border-radius:7px;padding:8px 10px;text-align:left;font-weight:500}
    .nav button:hover{background:var(--sunk);color:var(--ink)}
    .nav button.active{background:var(--brand-tint);color:var(--brand);box-shadow:none}
    .nav button.active::before{content:"";position:absolute;inset:7px auto 7px -10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
    .nav-icon{display:grid;place-items:center;width:20px;color:currentColor}
    .nav-icon svg,.topbar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .theme-sun{display:none}.theme-toggle[data-theme-icon="sun"] .theme-sun{display:block}.theme-toggle[data-theme-icon="sun"] .theme-moon{display:none}
    .side-foot{margin-top:auto;padding:16px 10px 4px;border-top:1px solid var(--rule)}
    .side-foot strong{display:block;color:var(--ink);font-size:var(--fs-small)}.side-foot span{color:var(--faint);font-size:var(--fs-small)}
    .main{min-width:0;background:var(--canvas)}
    .topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;min-height:70px;padding:12px 30px;background:var(--surface);border-bottom:1px solid var(--rule)}
    .icon-btn.menu-toggle{display:none}
    .module-context{display:grid;gap:2px;min-width:168px;padding-right:16px;border-right:1px solid var(--rule)}
    .module-context span{color:var(--faint);font-size:var(--fs-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .module-context strong{color:var(--ink);font-family:var(--sans);font-size:var(--fs-base);line-height:1.25}
    .search{position:relative;flex:1;max-width:560px}
    .search input{width:100%;height:44px;border:1px solid var(--rule-control);border-radius:9px;padding:0 14px 0 40px;background:var(--sunk);color:var(--ink)}
    .search-icon{position:absolute;left:13px;top:12px;z-index:1;color:var(--muted);pointer-events:none}
    .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid var(--rule-control);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 13px;font-weight:600}
    .btn:hover{border-color:var(--brand);background:var(--sunk)}
    .btn.primary{background:var(--brand);color:var(--surface);border-color:var(--brand)}
    .btn.primary:hover{background:var(--brand);filter:brightness(.9)}
    .btn.small{font-size:var(--fs-small);padding:7px 10px}
    .badge-demo{display:inline-flex;align-items:center;color:var(--faint);font-size:var(--fs-small);font-weight:500;white-space:nowrap}
    .top-menu{position:relative}
    .top-menu summary{list-style:none}
    .top-menu summary::-webkit-details-marker{display:none}
    .top-menu[open] summary{border-color:var(--brand);color:var(--brand)}
    .top-menu-popover{position:absolute;top:calc(100% + 8px);right:0;z-index:30;min-width:180px;padding:6px;border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
    .top-menu-popover .btn{width:100%;justify-content:flex-start;border:0}
    .page{padding:26px 30px 60px;max-width:1680px;margin:auto;background:var(--canvas)}
    .page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}
    .eyebrow{margin:0 0 6px;color:var(--pass);font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
    h1,h2,h3{font-family:var(--sans);color:var(--ink);margin:0}
    h1{font-size:30px;letter-spacing:-.025em;line-height:1.1}
    h2{font-size:20px;letter-spacing:-.01em}
    h3{font-size:15px}
    .subhead{margin:8px 0 0;color:var(--muted);font-size:var(--fs-base)}
    .as-of{text-align:right;color:var(--muted);font-size:var(--fs-small);line-height:1.6}.as-of strong{display:block;color:var(--ink);font-family:var(--sans)}
    .view[hidden]{display:none!important}
    .kpis{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:12px;margin-bottom:22px}
    .kpi{position:relative;min-height:118px;text-align:left;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);padding:15px 16px;overflow:hidden}
    .kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--kpi-color,var(--info))}
    .kpi:hover{border-color:var(--brand);background:var(--sunk)}
    .kpi-label{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:var(--fs-small);font-weight:600;line-height:1.3}
    .kpi-value{display:block;margin:10px 0 4px;color:var(--ink);font-family:var(--sans);font-size:25px;font-weight:700;letter-spacing:-.04em}
    .kpi-note{color:var(--muted);font-size:var(--fs-small)}.kpi-arrow{color:var(--brand)}
    .connected-ribbon{display:grid;grid-template-columns:minmax(180px,.7fr) repeat(3,minmax(0,1fr));gap:1px;margin-bottom:18px;border:1px solid var(--rule);border-radius:10px;background:var(--rule);overflow:hidden}
    .ribbon-lead{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:15px 16px;background:var(--sunk)}
    .ribbon-lead span{color:var(--brand);font-size:var(--fs-small);font-weight:700;letter-spacing:.09em;text-transform:uppercase}
    .ribbon-lead strong{color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.3}
    .connected-ribbon-item{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;background:var(--surface);padding:13px 14px;text-align:left}
    .connected-ribbon-item:hover{background:var(--sunk)}
    .ribbon-signal{color:var(--faint);font-size:var(--fs-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .connected-ribbon-item>strong{color:var(--ink);font-size:var(--fs-small);line-height:1.35}
    .ribbon-path{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 6px;color:var(--muted);font-size:var(--fs-small);line-height:1.35}
    .ribbon-path b{color:var(--faint);font-size:var(--fs-small);letter-spacing:.04em;text-transform:uppercase}
    .grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.75fr);gap:18px}
    .panel{min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 18px;border-bottom:1px solid var(--rule)}
    .panel-head p{margin:4px 0 0;color:var(--muted);font-size:var(--fs-small)}
    .panel-body{padding:18px}
    .attention{display:grid}
    .attention-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule);align-items:start;background:var(--surface);border-left:0;border-top:0;border-right:0;text-align:left;width:100%}
    .attention-row:last-child{border-bottom:0}.attention-row:hover{background:var(--sunk)}
    .rank{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;font-family:var(--sans);font-size:var(--fs-small)}
    .attn-title{font-weight:700;color:var(--ink);font-size:var(--fs-base)}.attn-meta{display:block;margin-top:5px;color:var(--muted);font-size:var(--fs-small);line-height:1.45}
    .impact{text-align:right;font-family:var(--sans);font-size:var(--fs-small);font-weight:700;color:var(--fail)}.impact small{display:block;font-family:var(--sans);font-size:var(--fs-small);color:var(--muted);font-weight:500}
    .status-pill,.type-pill,.workload-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:var(--fs-small);font-weight:700;white-space:nowrap}
    .status-pill.normal,.movement.context{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--info)}
    .status-pill.attention,.status-pill.at-risk,.status-pill.approval-required{background:color-mix(in srgb,var(--warn-fill) 14%,transparent);color:var(--warn)}
    .status-pill.overdue,.status-pill.escalated{background:color-mix(in srgb,var(--fail-fill) 14%,transparent);color:var(--fail)}
    .status-pill.closed{background:color-mix(in srgb,var(--pass-fill) 14%,transparent);color:var(--pass)}
    .status-pill.not-started{background:var(--sunk);color:var(--muted)}
    .status-pill.in-progress{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--info)}
    .status-pill.pending-verification{background:color-mix(in srgb,var(--warn-fill) 14%,transparent);color:var(--warn)}
    .status-pill.completed{background:color-mix(in srgb,var(--pass-fill) 14%,transparent);color:var(--pass)}
    .type-pill{background:var(--sunk);color:var(--muted)}
    .type-pill.critical{background:color-mix(in srgb,var(--fail-fill) 14%,transparent);color:var(--fail)}
    .type-pill.high{background:color-mix(in srgb,var(--warn-fill) 14%,transparent);color:var(--warn)}
    .type-pill.medium{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--info)}
    .type-pill.low{background:var(--sunk);color:var(--muted)}
    .dept-bars{display:grid;gap:13px}
    .dept-bar button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:0;color:var(--ink);font-size:var(--fs-small);font-weight:700}
    .bar{height:7px;background:var(--sunk);border-radius:99px;margin-top:7px;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--pass-fill)}
    .bar.red span{background:var(--fail-fill)}.bar.orange span{background:var(--warn-fill)}
    .filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
    .filters input,.filters select{height:36px;border:1px solid var(--rule-control);background:var(--surface);border-radius:7px;padding:0 10px;color:var(--ink);font-size:var(--fs-small)}
    .filters input:not([type="checkbox"]){min-width:210px}.filters input[type="checkbox"]{width:14px;height:14px;margin:0}.filter-count{margin-left:auto;color:var(--muted);font-family:var(--sans);font-size:var(--fs-small)}
    .table-wrap{overflow:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:920px;font-size:var(--fs-small)}
    th{position:sticky;top:0;z-index:2;background:var(--sunk);color:var(--muted);border-bottom:1px solid var(--rule-control);text-align:left;font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
    th button{border:0;background:transparent;color:inherit;padding:11px 12px;font:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:700}
    td{padding:11px 12px;border-bottom:1px solid var(--rule);color:var(--muted);vertical-align:middle}
    tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--sunk)}
    td strong{display:block;color:var(--ink);font-weight:700}.mono{font-family:var(--sans);font-variant-numeric:tabular-nums}
    .row-button{border:0;background:none;text-align:left;padding:0;color:inherit}.row-button:hover strong{color:var(--info);text-decoration:underline}
    .workload-pill.balanced{background:color-mix(in srgb,var(--pass-fill) 14%,transparent);color:var(--pass)}.workload-pill.heavy{background:color-mix(in srgb,var(--warn-fill) 14%,transparent);color:var(--warn)}.workload-pill.critical{background:color-mix(in srgb,var(--fail-fill) 14%,transparent);color:var(--fail)}
    .org-grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}
    .dept-card{border:1px solid var(--rule);border-radius:10px;background:var(--surface);overflow:hidden}
    .dept-card summary{list-style:none;display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer}.dept-card summary::-webkit-details-marker{display:none}
    .dept-code{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--brand);color:#fff;font-family:var(--sans);font-size:var(--fs-small)}
    .dept-summary{flex:1}.dept-summary strong{display:block;color:var(--ink)}.dept-summary span{font-size:var(--fs-small);color:var(--muted)}
    .dept-count{text-align:right;font-family:var(--sans);font-weight:700;color:var(--ink)}
    .dept-overdue-label{color:var(--fail);display:block;font-family:var(--sans);font-size:var(--fs-small);font-weight:700;letter-spacing:.04em}
    .dept-people{padding:0 16px 16px;border-top:1px solid var(--rule)}
    .person{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}.person:last-child{border-bottom:0}
    .avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand-tint);color:var(--info);font-size:var(--fs-small);font-family:var(--sans);font-weight:700}
    .person-info{flex:1}.person-info strong{display:block;font-size:var(--fs-small);color:var(--ink)}.person-info span{font-size:var(--fs-small);color:var(--muted)}
    .cadence-tabs{display:flex;gap:6px;padding:5px;background:var(--sunk);border-radius:9px;margin-bottom:16px;width:max-content}
    .cadence-tabs button{border:0;background:transparent;border-radius:6px;padding:7px 12px;color:var(--muted);font-size:var(--fs-small);font-weight:700}
    .cadence-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(7,26,47,.12)}
    .agenda{display:grid;gap:10px}.agenda-item{display:grid;grid-template-columns:96px minmax(0,1fr) 145px 110px;gap:15px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:13px 15px}
    .agenda-time{font-family:var(--sans);font-size:var(--fs-small);color:var(--pass);font-weight:700}.agenda-title{font-size:var(--fs-small);font-weight:700;color:var(--ink)}.agenda-title small{display:block;margin-top:4px;color:var(--muted);font-weight:500}
    .empty{padding:44px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}
    .scrim{position:fixed;inset:0;background:rgba(8,12,18,.48);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}.scrim.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,92vw);max-width:100%;background:var(--surface);z-index:45;box-shadow:var(--shadow-overlay);transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:22px;border-bottom:1px solid var(--rule)}
    .drawer-title{font-size:21px}.drawer-subtitle{margin:6px 0 0;color:var(--muted);font-size:var(--fs-small)}
    .icon-btn{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--rule-control);border-radius:8px;background:var(--surface);color:var(--muted)}
    .icon-btn:hover{background:var(--sunk);color:var(--ink)}
    .drawer-body{padding:22px;overflow:auto}.definition{padding:13px 14px;background:var(--brand-tint);border-left:3px solid var(--brand);border-radius:6px;color:var(--ink);font-size:var(--fs-small);line-height:1.5;margin-bottom:16px}

  function parseCsv(text){
    const rows=[];let row=[],cell="",quoted=false;
    for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===","&&!quoted){row.push(cell);cell=""}else if((ch==="\n"||ch==="\r")&&!quoted){if(ch==="\r"&&next==="\n")i++;row.push(cell);if(row.some(x=>x!==""))rows.push(row);row=[];cell=""}else cell+=ch}
    row.push(cell);if(row.some(x=>x!==""))rows.push(row);if(rows.length<2)return[];

  }

    const value=(row,key)=>key==="ownerId"?employeeById(row[key])?.role||"Not recorded":key==="managerId"?employeeById(row[key])?.role||"Management":row[key]??"Not recorded";
    openModal(`${type==="vendor"?"Vendor":"Employee"} register`,`
      <div class="filters"><input id="registry-search" value="${escapeHtml(search)}" placeholder="Filter all columns…"><span class="filter-count">${filtered.length} of ${source.length} records</span><button class="btn primary small" id="registry-add">+ Add ${type}</button></div>
      <div class="table-wrap"><table><thead><tr>${columns.map(([key,label])=>`<th><button data-registry-sort="${key}">${label}${sortKey===key?(direction==="asc"?" ↑":" ↓"):""}</button></th>`).join("")}</tr></thead><tbody>${filtered.map(row=>`<tr>${columns.map(([key])=>`<td>${key==="name"||key==="role"?`<strong>${escapeHtml(value(row,key))}</strong><span class="mono">${row.id}</span>`:escapeHtml(value(row,key))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    const registrySearch=document.getElementById("registry-search");registrySearch.focus();registrySearch.setSelectionRange(search.length,search.length);
    registrySearch.addEventListener("input",event=>openRegistry(type,event.target.value,sortKey,direction));
    document.getElementById("registry-add").addEventListener("click",()=>addRecordModal(type));
    document.querySelectorAll("[data-registry-sort]").forEach(button=>button.addEventListener("click",()=>openRegistry(type,search,button.dataset.registrySort,sortKey===button.dataset.registrySort&&direction==="asc"?"desc":"asc")));
  }
  function openImport(){
    openModal("Excel-compatible import",`<div class="form-grid"><div class="field"><label>Record type</label><select id="import-type"><option value="employee">Employees</option><option value="vendor">Vendors</option><option value="task">Tasks</option></select></div><div class="field"><label>Input method</label><button class="btn" id="choose-csv" type="button">Choose CSV file</button></div><div class="field full import-drop"><label>Or paste an Excel range</label><p class="field-hint">Include a header row matching the downloaded template.</p><textarea id="paste-data" placeholder="id	role	department	managerId&#10;EMP-021	Accounts Trainee	Accounts	EMP-001"></textarea></div><div class="field full" id="import-preview"></div></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="preview-import">Validate rows</button>`);
    document.getElementById("choose-csv").addEventListener("click",()=>document.getElementById("csv-file").click());
    document.getElementById("preview-import").addEventListener("click",previewImport);
  }
  function previewImport(){
    const text=document.getElementById("paste-data").value.trim(),type=document.getElementById("import-type").value;
    if(!text)return showToast("Paste rows or choose a CSV file.",true);
    const rows=text.includes("\t")?parsePastedGrid(text):parseCsv(text),result=mapImportRows(rows,type),preview=document.getElementById("import-preview");
    preview.innerHTML=`<div class="definition"><strong>${result.valid.length} valid</strong> · ${result.rejected.length} rejected · ${rows.length} total. Current data has not changed.</div>${result.rejected.length?`<div class="table-wrap"><table><thead><tr><th>Row</th><th>Reason</th></tr></thead><tbody>${result.rejected.map(x=>`<tr><td>${x._row}</td><td>${escapeHtml(x._error)}</td></tr>`).join("")}</tbody></table></div>`:""}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="commit-import" ${!result.valid.length?"disabled":""}>Import ${result.valid.length} valid rows</button>${result.rejected.length?`<button class="btn" id="download-rejected">Download rejected rows</button>`:""}</div>`;
    document.getElementById("commit-import")?.addEventListener("click",()=>{try{const candidate=clone(result.working);candidate.activity.unshift({id:nextId("ACT",candidate.activity),action:`${result.valid.length} ${type} rows imported`,at:"2026-07-23 13:45",actor:"Management"});commitState(candidate);closeOverlays();renderApp();showToast(`${result.valid.length} rows imported`)}catch(error){showToast(`Import rejected: ${error.message}`,true)}});
    document.getElementById("download-rejected")?.addEventListener("click",()=>download(`kitco-${type}-rejected.csv`,toCsv(result.rejected),"text/csv"));
  }
  function exportStateJson(){download("KITCO-Management-Suite-backup.json",JSON.stringify(state,null,2),"application/json")}
  function exportVisibleCsv(){const rows=filterRecords(state.tasks,{...ui.taskFilters,search:ui.taskFilters.search||ui.search});download("KITCO-filtered-tasks.csv",toCsv(rows),"text/csv")}
  function resetDemo(){if(!confirm("Reset the demonstration and remove all local additions?"))return;try{const candidate=migrateStateToV5(seedData());candidate.activity.unshift({id:"ACT-RESET",action:"Demonstration reset",at:"2026-07-23 14:00",actor:"Management"});commitState(candidate);closeOverlays();renderApp();showToast("Demo restored to original data")}catch(error){showToast(`Reset rejected: ${error.message}`,true)}}
  function handleJsonFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const migrated=migrateStateToV5(JSON.parse(reader.result)),validation=validateState(migrated),businessValidation=validateBusinessState(migrated);if(!validation.valid||!businessValidation.valid)throw new Error([...validation.errors,...businessValidation.errors].join(" "));commitState(migrated);closeOverlays();renderApp();showToast("Backup restored")}catch(error){showToast(`Import rejected: ${error.message}`,true)}};reader.readAsText(file)}
  function handleCsvFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const area=document.getElementById("paste-data");if(area)area.value=reader.result};reader.readAsText(file)}
  function bindDynamicEvents(){
    document.querySelectorAll("[data-toggle-all-metrics]").forEach(x=>x.onclick=()=>toggleAllMetrics(x.getAttribute("aria-expanded")!=="true"));
    document.querySelectorAll("[data-execution-filter]").forEach(x=>x.onclick=()=>{if(applyExecutionSummaryContext(x.dataset.executionFilter))setView("ledger")});
    document.querySelectorAll("[data-business-kpi]").forEach(x=>x.onclick=()=>openBusinessKpi(x.dataset.businessKpi));
    document.querySelectorAll("[data-accounting-metric]").forEach(x=>x.onclick=()=>openAccountingDrilldown(x.dataset.accountingMetric));
    document.querySelectorAll("[data-accounting-role]").forEach(x=>x.onclick=()=>{ui.taskFilters={department:"Accounts",assigneeId:x.dataset.accountingRole,status:"All",priority:"All",type:"All",cadence:"All",overdue:false,approval:false,highPriority:false,search:""};setView("ledger")});
    document.querySelectorAll("[data-accounting-category]").forEach(x=>x.onclick=()=>{ui.taskFilters={department:"Accounts",assigneeId:"All",status:"All",priority:"All",type:"All",cadence:"All",overdue:false,approval:false,highPriority:false,search:x.dataset.accountingCategory};setView("ledger")});
    document.querySelectorAll("[data-accounting-all]").forEach(x=>x.onclick=()=>{ui.taskFilters={department:"Accounts",assigneeId:"All",status:"All",priority:"All",type:"All",cadence:"All",overdue:false,approval:false,highPriority:false,search:""};setView("ledger")});
    document.querySelectorAll("[data-story]").forEach(x=>x.onclick=()=>openStory(x.dataset.story));
    document.querySelectorAll("[data-view-open]").forEach(x=>x.onclick=()=>{closeOverlays();setView(x.dataset.viewOpen)});
    document.querySelectorAll("[data-kpi]").forEach(x=>x.onclick=()=>openKpiDrilldown(x.dataset.kpi));
    document.querySelectorAll("[data-task]").forEach(x=>x.onclick=()=>openTask(x.dataset.task));
    document.querySelectorAll("[data-employee]").forEach(x=>x.onclick=()=>openEmployee(x.dataset.employee));
    document.querySelectorAll("[data-department]").forEach(x=>x.onclick=()=>{ui.taskFilters.department=x.dataset.department;ui.view="ledger";renderApp()});
    document.querySelectorAll("[data-sort]").forEach(x=>x.onclick=()=>{const key=x.dataset.sort;ui.sort={key,direction:ui.sort.key===key&&ui.sort.direction==="asc"?"desc":"asc"};renderApp()});
    document.querySelectorAll("[data-filter]").forEach(x=>x.oninput=()=>{const key=x.dataset.filter;ui.taskFilters[key]=x.value;renderApp();if(key==="search"){const next=document.querySelector('[data-filter="search"]');next?.focus();next?.setSelectionRange(ui.taskFilters.search.length,ui.taskFilters.search.length)}});
    document.querySelectorAll("[data-check-filter]").forEach(x=>x.onchange=()=>{ui.taskFilters[x.dataset.checkFilter]=x.checked;renderApp()});
    document.querySelectorAll("[data-clear-filters]").forEach(x=>x.onclick=()=>{ui.taskFilters={department:"All",assigneeId:"All",status:"All",priority:"All",type:"All",cadence:"All",overdue:false,approval:false,highPriority:false,search:""};renderApp()});
    document.querySelectorAll("[data-filter-overdue]").forEach(x=>x.onclick=()=>{ui.taskFilters.overdue=true;ui.view="ledger";renderApp()});
    document.querySelectorAll("[data-cadence]").forEach(x=>x.onclick=()=>{ui.calendarCadence=x.dataset.cadence;renderApp()});
    document.querySelectorAll("[data-taskflow-mode]").forEach(x=>x.onclick=()=>setTaskFlowMode(x.dataset.taskflowMode));
    document.querySelectorAll("[data-preset]").forEach(x=>x.onclick=()=>{
      ui.taskFilters={department:"All",assigneeId:"All",status:"All",priority:"All",type:"All",cadence:"All",overdue:false,approval:false,highPriority:false,search:""};
      if(x.dataset.preset==="my-overdue")ui.taskFilters.overdue=true;
      if(x.dataset.preset==="approvals")ui.taskFilters.approval=true;
      if(x.dataset.preset==="high-impact")ui.taskFilters.highPriority=true;
      ui.taskFlowMode="list";renderApp();
    });
    document.querySelectorAll("[data-taskflow-group]").forEach(x=>x.onclick=()=>{
      const expanded=x.getAttribute("aria-expanded")==="true";
      x.setAttribute("aria-expanded",String(!expanded));
      x.innerHTML=`${expanded?"&#8250;":"&#8964;"} ${escapeHtml(x.dataset.taskflowLabel)}`;
      document.querySelectorAll(`[data-taskflow-group-row="${x.dataset.taskflowGroup}"]`).forEach(row=>row.hidden=expanded);
    });
    document.querySelectorAll("[data-taskflow-add]").forEach(x=>x.onclick=()=>addRecordModal("task"));
    document.querySelectorAll("[data-task-complete]").forEach(x=>x.onclick=event=>{
      event.stopPropagation();
      const taskId=x.dataset.taskComplete,completed=x.getAttribute("aria-pressed")!=="true";
      toggleTaskCompletion(taskId,completed);
    });
    document.getElementById("taskflow-columns")?.addEventListener("click",()=>showToast("All task columns are visible"));
    document.getElementById("taskflow-add")?.addEventListener("click",()=>addRecordModal("task"));
    document.querySelectorAll("[data-edit-task]").forEach(x=>x.onclick=()=>{closeOverlays();addRecordModal("task")});
  }
  function bindStaticEvents(){
    document.querySelectorAll("[data-view-target]").forEach(button=>button.addEventListener("click",()=>setView(button.dataset.viewTarget)));
    document.getElementById("theme-toggle")?.addEventListener("click",toggleTheme);
    document.getElementById("menu-toggle").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("top-add").addEventListener("click",()=>addRecordModal("task"));document.getElementById("open-add").addEventListener("click",()=>addRecordModal("task"));document.getElementById("open-tools").addEventListener("click",openDataTools);
    document.getElementById("print-summary").addEventListener("click",()=>window.print());document.getElementById("scrim").addEventListener("click",closeOverlays);
    document.getElementById("top-second-brain").addEventListener("click",()=>openSecondBrain());
    document.getElementById("global-search").addEventListener("input",event=>{ui.taskFilters.search=event.target.value;if(ui.view==="overview")ui.view="ledger";renderApp()});
    document.getElementById("json-file").addEventListener("change",event=>handleJsonFile(event.target.files[0]));document.getElementById("csv-file").addEventListener("change",event=>handleCsvFile(event.target.files[0]));
    document.addEventListener("click",event=>{
      if(event.target.closest("[data-close]"))closeOverlays();
      if(event.target.closest("[data-import]"))openImport();
      if(event.target.closest("[data-registry]"))openRegistry(event.target.closest("[data-registry]").dataset.registry);
      if(event.target.closest("[data-export-json]"))exportStateJson();
      if(event.target.closest("[data-import-json]"))document.getElementById("json-file").click();
      if(event.target.closest("[data-export-csv]"))exportVisibleCsv();
      if(event.target.closest("[data-template]")){const type=document.getElementById("template-type").value;download(`KITCO-${type}-template.csv`,templateFor(type),"text/csv")}
      if(event.target.closest("[data-reset]"))resetDemo();
    });
    document.addEventListener("keydown",handleGlobalKeydown);
  }
  function handleGlobalKeydown(event){if(event.key==="Escape"){closeOverlays();closeSecondBrain()}}
  if(typeof document!=="undefined"&&typeof document.addEventListener==="function"){
    document.addEventListener("DOMContentLoaded",()=>{loadState();applyTheme(getStoredTheme());bindStaticEvents();renderApp()});
  }
  </script>
</body>
</html>
